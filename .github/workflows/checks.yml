name: Sircarft checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check dashboard JavaScript syntax
        run: node --check app.js
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server-api/requirements.txt
      - name: Install API dependencies
        working-directory: server-api
        run: pip install -r requirements.txt
      - name: Test API foundation
        working-directory: server-api
        run: python -m pytest -q
